syntax = "proto3";

package pb;

option go_package = "github.com/pantopic/kitsune/common/pkg/pb";

message TickRequest {
  uint64 term = 1;
}
message TickResponse {
  uint64 epoch = 1;
}

message TermRequest {
  uint64 term = 1;
}
message TermResponse {
}

message Request {
  string Action = 1;
}

message ListQueuesRequest {
  uint64 MaxResults = 1;
  string NextToken = 2;
  string QueueNamePrefix = 3;
  bool MaxResultsSet = 4;
}

message ListQueuesResponse {
  repeated string QueueUrls = 1;
  string NextToken = 2;
}

message CreateQueueRequest {
  string QueueName = 1;
  map<string, string> Attributes = 2;
}

message CreateQueueResponse {
  string QueueName = 1;
}

message QueueListResponse {
  repeated string QueueNames = 1;
  string NextToken = 2;
}

message GetQueueUrlRequest {
  string QueueName = 1;
}

message GetQueueUrlResponse {
  string QueueName = 1;
}

message DeleteQueueRequest {
  string QueueName = 1;
}

message GetQueueAttributesRequest {
  string QueueName = 1;
  repeated string AttributeNames = 2;
}

message GetQueueAttributesResponse {
  map<string, string> Attributes = 1;
}

message SetQueueAttributesRequest {
  string QueueName = 1;
  map<string, string> Attributes = 2;
}

message QueueProperties {
  map<string, string> Attributes = 1;
}

message SendMessageRequest {
  string QueueName = 1;
  string MessageBody = 2;
  uint64 DelaySeconds = 3;
  bool DelaySecondsSet = 4;
  map<string, MessageAttribute> MessageAttributes = 5;
  map<string, MessageAttribute> MessageSystemAttributes = 6;
}

message MessageAttribute {
  string DataType = 1;
  string StringValue = 2;
  bytes BinaryValue = 3;
  bool StringValueSet = 4;
  bool BinaryValueSet = 5;
  bool Invalid = 6;
}

message SendMessageResponse {
  string MessageId = 1;
  string Md5OfMessageBody = 2;
  string Md5OfMessageAttributes = 3;
  string Md5OfMessageSystemAttributes = 4;
}

message SendMessageBatchRequest {
  string QueueName = 1;
  repeated SendMessageBatchRequestEntry Entries = 2;
}

message SendMessageBatchRequestEntry {
  string Id = 1;
  string MessageBody = 2;
  uint64 DelaySeconds = 3;
  bool DelaySecondsSet = 4;
  bool MessageBodySet = 5;
  bool UnsupportedFields = 6;
  map<string, MessageAttribute> MessageAttributes = 7;
  map<string, MessageAttribute> MessageSystemAttributes = 8;
}

message SendMessageBatchResultEntry {
  string Id = 1;
  string MessageId = 2;
  string Md5OfMessageBody = 3;
  string Md5OfMessageAttributes = 4;
  string Md5OfMessageSystemAttributes = 5;
}

message BatchResultErrorEntry {
  string Id = 1;
  string Code = 2;
  string Message = 3;
  bool SenderFault = 4;
}

message SendMessageBatchResponse {
  repeated SendMessageBatchResultEntry Successful = 1;
  repeated BatchResultErrorEntry Failed = 2;
}

message ReceiveMessageRequest {
  string QueueName = 1;
  uint64 MaxNumberOfMessages = 2;
  uint64 VisibilityTimeout = 3;
  bool VisibilityTimeoutSet = 4;
  uint64 WaitTimeSeconds = 5;
  bool WaitTimeSecondsSet = 6;
  repeated string MessageAttributeNames = 7;
  repeated string MessageSystemAttributeNames = 8;
  bool MaxNumberOfMessagesSet = 9;
}

message ReceivedMessage {
  string MessageId = 1;
  string ReceiptHandle = 2;
  string Body = 3;
  map<string, MessageAttribute> MessageAttributes = 4;
  string Md5OfMessageAttributes = 5;
  map<string, string> Attributes = 6;
}

message ReceiveMessageResponse {
  repeated ReceivedMessage Messages = 1;
}

message DeleteMessageRequest {
  string QueueName = 1;
  string ReceiptHandle = 2;
}

message MessageReceiptBatchRequest {
  string QueueName = 1;
  repeated MessageReceiptBatchRequestEntry Entries = 2;
}

message MessageReceiptBatchRequestEntry {
  string Id = 1;
  string ReceiptHandle = 2;
  uint64 VisibilityTimeout = 3;
  bool VisibilityTimeoutSet = 4;
}

message MessageReceiptBatchResultEntry {
  string Id = 1;
}

message MessageReceiptBatchResponse {
  repeated MessageReceiptBatchResultEntry Successful = 1;
  repeated BatchResultErrorEntry Failed = 2;
}

message ChangeMessageVisibilityRequest {
  string QueueName = 1;
  string ReceiptHandle = 2;
  uint64 VisibilityTimeout = 3;
}

message StoredMessage {
  uint64 Expires = 1;
  uint64 SentTimestamp = 2;
  uint32 ReceiveCount = 3;
  uint64 ReadyAt = 4;
  uint64 ActiveUntil = 5;
  uint64 ReceiptGeneration = 6;
  uint64 ReceiptTimeout = 7;
  map<string, MessageAttribute> MessageAttributes = 8;
  map<string, MessageAttribute> MessageSystemAttributes = 9;
}
