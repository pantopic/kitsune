common:
  request:
    url:
      - /
    method:
      - POST
    headers:
      X-Amz-Target: AmazonSQS.<Action>
      Authorization: <AuthParams>
    request:
      contentTypes:
        - application/x-amz-json-1.0
  response:
    codes:
    - 200
    - 400
    headers:
      x-amzn-RequestId: <requestId>
    contentTypes:
      - application/x-amz-json-1.0
    errors:
      - InvalidAddress
      - InvalidSecurity
      - RequestThrottled
      - UnsupportedOperation

actions:
  ListQueues:
    request:
      params:
        MaxResults: int (1, 1000)
        NextToken: string
        QueueNamePrefix: string
    response:
      params:
        NextToken: string
        QueueUrls: string[]
  CreateQueue:
    request:
      params:
        Action: "CreateQueue"
        Attributes:
          DelaySeconds: int (0, 900) 0
          MaximumMessageSize: int (1<<10, 1<<20) 1<<20
          MessageRetentionPeriod: int (60,  14 days) 4 days
          ReceiveMessageWaitTimeSeconds: int (0, 20) 0
          VisibilityTimeout: int (0, 12 hours) 30
          FifoQueue: bool false
          # ---
          ContentBasedDeduplication: bool false
          DeduplicationScope: string (queue, messageGroup) queue
          FifoThroughputLimit: string (perQueue, perMessageGroupId) perQueue
          Policy: string
        QueueName: string ([a-zA-Z0-9_-]{0,80})(?.fifo) required, case-sensitive
        tags: map[string]string
    response:
      params:
        QueueUrl: string
      errors:
        - InvalidAttributeName
        - InvalidAttributeValue
        - QueueDeletedRecently
        - QueueNameExists
  DeleteQueue:
    request:
      params:
        QueueURL: string
    response:
      errors:
        - QueueDoesNotExist
  PurgeQueue:
    request:
      params:
        QueueURL: string
    response:
      errors:
        - PurgeQueueInProgress
        - QueueDoesNotExist
  GetQueueUrl:
    request:
      params:
        QueueName: string ([a-zA-Z0-9_-]{0,80})(?.fifo) required
        QueueOwnerAWSAccountId: string optional
    response:
      params:
        QueueUrl: string
      errors:
        - QueueDoesNotExist
  GetQueueAttributes:
    request:
      params:
        AttributeNames:
          type: string[] optional # (empty returns no results)
          values:
            - ApproximateNumberOfMessages: int
            - ApproximateNumberOfMessagesDelayed: int
            - ApproximateNumberOfMessagesNotVisible: int
            - CreatedTimestamp: timestamp
            - DelaySeconds: int
            - LastModifiedTimestamp: timestamp
            - MaximumMessageSize: int
            - MessageRetentionPeriod: int
            - Policy: string
            - QueueArn: string
            - ReceiveMessageWaitTimeSeconds: int
            - VisibilityTimeout: int
            - FifoQueue: string
            - ContentBasedDeduplication: bool
            - DeduplicationScope: string
            - FifoThroughputLimit: string
        QueueURL: string
    response:
      params:
        Attributes: map[string]string
      errors:
        - InvalidAttributeName
        - QueueDoesNotExist
  SetQueueAttributes:
    request:
      params:
        Attributes:
          type: map[string]string
          keys:
            - DelaySeconds: int
            - MaximumMessageSize: int
            - MessageRetentionPeriod: int
            - Policy: string
            - ReceiveMessageWaitTimeSeconds: int
            - VisibilityTimeout: int
            - ContentBasedDeduplication: bool
            - DeduplicationScope: string
            - FifoThroughputLimit: string
        QueueURL: string
    response:
      errors:
        - InvalidAttributeName
        - InvalidAttributeValue
        - OverLimit
        - QueueDoesNotExist
  SendMessage:
    request:
      params:
        DelaySeconds: int
        MessageAttributes:
          type: map[string]map[string]string
          key_validation:
            - (a-zA-Z0-9\._-)
            - 256 chars
            - prefix_disallowed: AWS, Amazon, . (case-insensitive)
            - suffix_disallowed: .
          value_keys:
            - BinaryListValues: blob[]
            - BinaryValue: blob
            - DataType: string
            - StringListValues: string[]
            - StringValue: string
        MessageBody: string
        MessageDeduplicationId: string
        MessageGroupId: string
        MessageSystemAttributes:
          type: map[string]string
          keys:
            - AWSTraceHeader
          values:
            - BinaryListValues: blob[]
            - BinaryValue: blob
            - DataType: string
            - StringListValues: string[]
            - StringValue: string
        QueueUrl: string
    response:
      params:
        MD5OfMessageAttributes: string
        MD5OfMessageBody: string
        MD5OfMessageSystemAttributes: string (optional)
        MessageId: string
        SequenceNumber: string (optional, fifo only, 128bit number)
      errors:
        - InvalidMessageContents
        - QueueDoesNotExist
  SendMessageBatch:
    request:
      params:
        Entries: SendMessageBatchRequestEntry[]
        QueueUrl: string
    response:
      params:
        Failed: BatchResultErrorEntry[]
        Successful: SendMessageBatchResultEntry[]
      errors:
        - BatchEntryIdsNotDistinct
        - BatchRequestTooLong
        - EmptyBatchRequest
        - InvalidBatchEntryId
        - QueueDoesNotExist
        - TooManyEntriesInBatchRequest
  ReceiveMessage:
    request:
      params:
        AttributeNames: string[] (deprecated)
        MaxNumberOfMessages: number (1, 10) 1
        MessageAttributeNames: string[] (a-zA-Z0-9\._-)(?[0-9]+<index>)
        MessageSystemAttributeNames:
          type: string[]
          values:
            - All
            - ApproximateFirstReceiveTimestamp
            - ApproximateReceiveCount
            - AWSTraceHeader
            - SenderId
            - SentTimestamp
            - SqsManagedSseEnabled
            - MessageDeduplicationId
            - MessageGroupId
            - SequenceNumber
        QueueUrl: string
        ReceiveRequestAttemptId: string (128 chars)
        VisibilityTimeout: number (0, 12 hours) 30
        WaitTimeSeconds: number (0, 20) 0
    response:
      params:
        Messages: Message[]
      errors:
        - OverLimit
        - QueueDoesNotExist
  DeleteMessage:
    request:
      params:
        QueueUrl: string
        ReceiptHandle: string
    response:
      errors:
        - QueueDoesNotExist
        - ReceiptHandleIsInvalid
  DeleteMessageBatch:
    request:
      params:
        Entries: DeleteMessageBatchRequestEntry[]
        QueueUrl: string
    response:
      params:
        Failed: BatchResultErrorEntry[]
        Successful: DeleteMessageBatchResultEntry[]
      errors:
        - EmptyBatchRequest
        - InvalidBatchEntryId
        - QueueDoesNotExist
        - TooManyEntriesInBatchRequest
  ChangeMessageVisibility:
    request:
      params:
        QueueUrl: string
        ReceiptHandle: string
        VisibilityTimeout: number (0, 12 hours) 30
    response:
      errors:
        - MessageNotInflight
        - QueueDoesNotExist
        - ReceiptHandleIsInvalid
  ChangeMessageVisibilityBatch:
    request:
      params:
        Entries: ChangeMessageVisibilityBatchRequestEntry[]
        QueueUrl: string
    response:
      params:
        Failed: BatchResultErrorEntry[]
        Successful: ChangeMessageVisibilityBatchResultEntry[]
      errors:
        - EmptyBatchRequest
        - InvalidBatchEntryId
        - QueueDoesNotExist
        - TooManyEntriesInBatchRequest

# ---

  AddPermission:
  CancelMessageMoveTask:
  ListDeadLetterSourceQueues:
  ListMessageMoveTasks:
  ListQueueTags:
  RemovePermission:
  StartMessageMoveTask:
  TagQueue:
  UntagQueue:

errors:
  BatchEntryIdsNotDistinct: Two or more batch entries in the request have the same Id.
  BatchRequestTooLong: The length of all the messages put together is more than the limit.
  EmptyBatchRequest: The batch request doesn't contain any entries.
  InvalidAddress: The specified ID is invalid.
  InvalidAttributeName: The specified attribute doesn't exist.
  InvalidAttributeValue: A queue attribute value is invalid.
  InvalidBatchEntryId: The Id of a batch entry in a batch request doesn't abide by the specification.
  InvalidMessageContents: The message contains characters outside the allowed set.
  InvalidSecurity: The request was not made over HTTPS or did not use SigV4 for signing.
  KmsAccessDenied: The caller doesn't have the required KMS access.
  KmsDisabled: The request was denied due to request throttling.
  KmsInvalidKeyUsage: The request was rejected because key is incompatible with api operation or signing algorithm
  KmsInvalidState: The request was rejected because the state of the specified resource is not valid for this request.
  KmsNotFound: The request was rejected because the specified entity or resource could not be found.
  KmsOptInRequired: The request was rejected because the specified key policy isn't syntactically or semantically correct.
  KmsThrottled: AWS KMS throttles requests for the following conditions.
  OverLimit: The specified action violates a limit. # ie. inflight message limit exceeded
  PurgeQueueInProgress: The specified queue previously received a PurgeQueue request within the last 60 seconds
  QueueDeletedRecently: You must wait 60 seconds after deleting a queue before you can create another queue with the same name.
  QueueDoesNotExist: Ensure that the QueueUrl is correct and that the queue has not been deleted.
  QueueNameExists: A queue with this name already exists. Amazon SQS returns this error only if the request includes attributes whose values differ from those of the existing queue.
  RequestThrottled: The request was denied due to request throttling.
  TooManyEntriesInBatchRequest: The batch request contains more entries than permissible.
  UnsupportedOperation: Error code 400. Unsupported operation.
  ReceiptHandleIsInvalid: The specified receipt handle isn't valid.

common_errors:
  AccessDeniedException: 400 (sic), "You do not have sufficient access to perform this action."
  IncompleteSignature: 400 (sic), "The request signature does not conform to AWS standards."
  InternalFailure: 500, "Request processing has failed because of an unknown error, exception or failure."
  InvalidClientTokenId: 403, "Request processing has failed because of an unknown error, exception or failure."
  InvalidParameterCombination: 400, "Parameters that must not be used together were used together."
  MalformedQueryString: 404, "The query string contains a syntax error."
  MissingAction: 400, "The request is missing an action or a required parameter."
  MissingAuthenticationToken: 403, "The request must contain either a valid (registered) AWS access key ID or X.509 certificate."
  MissingParameter: 400, "A required parameter for the specified action is not supplied."
  NotAuthorized: 400 (sic), "You do not have permission to perform this action."
  OptInRequired: 403, "The AWS access key ID needs a subscription for the service."
  RequestExpired: 400, ""
  ServiceUnavailable: 503, ""
  ThrottlingException: 403, "The request was denied due to request throttling."
  ValidationError: 400, ""

error_response:
  status:
    - 400
  headers:
    x-amzn-query-error: AWS.SimpleQueueService.NonExistentQueue;Sender
  content-types:
    - application/x-amz-json-1.0
  params:
    __type: "com.amazonaws.sqs#QueueDoesNotExist"
    message: "The specified queue does not exist."


SendMessageBatchRequestEntry:
  DelaySeconds: number
  Id: string
  MessageAttributes:
    type: map[string]map[string]string
    key_validation:
      - (a-zA-Z0-9\._-)
      - 256 chars
      - prefix_disallowed: AWS, Amazon, . (case-insensitive)
      - suffix_disallowed: .
    value_keys:
      - BinaryListValues: blob[]
      - BinaryValue: blob
      - DataType: string
      - StringListValues: string[]
      - StringValue: string
  MessageBody: string
  MessageDeduplicationId: string
  MessageGroupId: string
  MessageSystemAttributes:
    type: map[string]string
    keys:
      - AWSTraceHeader
    values:
      - BinaryListValues: blob[]
      - BinaryValue: blob
      - DataType: string
      - StringListValues: string[]
      - StringValue: string

BatchResultErrorEntry:
  Code: string
  Id: string
  Message: string
  SenderFault: boolean

SendMessageBatchResultEntry:
  Id: string
  MD5OfMessageAttributes: string
  MD5OfMessageBody: string
  MD5OfMessageSystemAttributes: string (optional)
  MessageId: string
  SequenceNumber: string (optional, fifo only, 128bit number)

Message:
  Attributes: map[string]string
  Body: string
  MD5OfMessageAttributes: string
  MD5OfBody: string
  MessageAttributes:
    type: map[string]map[string]string
    key_validation:
      - (a-zA-Z0-9\._-)
      - 256 chars
      - prefix_disallowed: AWS, Amazon, . (case-insensitive)
      - suffix_disallowed: .
    value_keys:
      - BinaryListValues: blob[]
      - BinaryValue: blob
      - DataType: string
      - StringListValues: string[]
      - StringValue: string
  MessageId: string
  ReceiptHandle: string

DeleteMessageBatchRequestEntry:
  Id: string
  ReceiptHandle: string

DeleteMessageBatchResultEntry:
  Id: string

BatchResultErrorEntry:
  Code: string (error code)
  Id: string
  SenderFault: bool
  Message: string (error message)

ChangeMessageVisibilityBatchRequestEntry:
  Id: string
  ReceiptHandle: string
  VisibilityTimeout: number (0, 12 hours) 30

ChangeMessageVisibilityBatchResultEntry:
  Id: string
